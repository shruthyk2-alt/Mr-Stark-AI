[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-stark"
version = "1.0.0"
description = "Personal AI Assistant with Voice Interaction and Gemini Integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Shruthy", email = "shruthy@example.com"}
]
keywords = ["ai", "assistant", "voice", "gemini", "desktop", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = [
    "PySide6>=6.7.0",
    "python-dotenv>=1.0.1",
    "google-genai>=0.1.0",
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
mr-stark = "mr_stark:main"

[project.urls]
Repository = "https://github.com/yourusername/mr-stark"
"Bug Tracker" = "https://github.com/yourusername/mr-stark/issues"
Documentation = "https://github.com/yourusername/mr-stark/blob/main/README.md"

[tool.setuptools]
packages = ["app", "app.core", "app.ui", "app.tools", "app.permissions", "app.personality"]

[tool.setuptools.package-data]
app = ["**/*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
